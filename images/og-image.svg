<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A017" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#D4A017" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative circles -->
  <circle cx="980" cy="120" r="220" fill="#40916C" opacity="0.18"/>
  <circle cx="1080" cy="520" r="160" fill="#D4A017" opacity="0.10"/>
  <circle cx="120" cy="540" r="140" fill="#40916C" opacity="0.12"/>

  <!-- Label -->
  <text x="100" y="190" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#D4A017" letter-spacing="5" text-anchor="start">MASTERARBEIT 2026 / 2027</text>

  <!-- Brand name -->
  <text x="100" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#FFFFFF" letter-spacing="-2">ORIGIN</text>
  <text x="577" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#D4A017" letter-spacing="-2">TERRA</text>

  <!-- Divider line -->
  <rect x="100" y="325" width="120" height="3" fill="#D4A017" rx="2"/>

  <!-- Subtitle -->
  <text x="100" y="390" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.85)">Direktvermarktung digital – Landwirte &amp; Verbraucher</text>

  <!-- Bottom tag -->
  <text x="100" y="490" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="rgba(255,255,255,0.55)">originterra.de</text>

  <!-- Right icon area -->
  <text x="1000" y="360" font-family="Arial" font-size="80" text-anchor="middle" fill="rgba(255,255,255,0.12)">🌾</text>
</svg>
